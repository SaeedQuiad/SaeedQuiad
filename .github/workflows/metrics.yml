name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Need METRICS_TOKEN
        if: env.HAS_PAT != 'true'
        run: echo "::notice::Add a METRICS_TOKEN repo secret (classic PAT with repo, read:user, read:org) to render metrics."

      # Needs METRICS_TOKEN (classic PAT: repo, read:user, read:org). With only
      # GITHUB_TOKEN every counter renders as 0 because his work is private, so the
      # render is skipped until the secret exists.
      - uses: lowlighter/metrics@v3.34
        if: env.HAS_PAT == 'true'
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_message: "Update metrics"
          user: SaeedQuiad
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          config_display: large
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_lines: yes
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_notable: yes
          plugin_traffic: no

      - uses: actions/checkout@v4
        if: env.HAS_PAT == 'true'
      - name: Show metrics in README
        if: env.HAS_PAT == 'true'
        run: |
          git pull --ff-only
          if ! grep -q 'metrics.general.svg' README.md; then
            echo "" >> README.md
            echo '<img width="100%" alt="Metrics" src="metrics.general.svg">' >> README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Show metrics" && git push
          fi
